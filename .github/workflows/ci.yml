name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
# Le jeton du job n'a besoin que de lire le dépôt : un `npm ci` qui exécute du
# code de PR (ou un script d'installation compromis) ne doit rien pouvoir écrire.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Épinglé au commit (pas au tag mutable) : le code de cette action ne peut
      # pas changer sans une modification relue ici. `persist-credentials: false` :
      # aucune étape suivante ne fait de git authentifié, et les scripts lancés
      # par npm ne doivent pas trouver de jeton sur le disque.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
